<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2603 設備 3D Viewer｜InControl</title><link rel="stylesheet" href="../../assets/style.css"><style>#viewer{height:72vw;max-height:720px;min-height:430px;background:#101613;border-radius:16px;overflow:hidden;position:relative}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bar button{border:1px solid #ccd5d0;background:#fff;padding:9px 14px;border-radius:8px;cursor:pointer}.bar button:hover{background:#eaf7f0}.status{position:absolute;left:16px;bottom:14px;color:#cfe4d8;background:#07100bc9;padding:8px 11px;border-radius:7px;font-size:12px}canvas{display:block;width:100%;height:100%}</style></head><body><header class="top"><a class="brand" href="../../"><span>INCONTROL</span><small>Automation Knowledge Base</small></a></header><main style="margin:auto"><p><a href="../" style="color:#075f3d">← 返回設備實務</a></p><section class="hero"><p class="eyebrow">3D EQUIPMENT VIEWER</p><h1>2603 設備 3D Viewer</h1><p>滑鼠左鍵旋轉・滾輪縮放・右鍵平移</p></section><div class="bar"><button id="reset">重置視角</button><button id="rotate">自動旋轉：關</button></div><div id="viewer"><div class="status" id="status">載入 3D 模型中…</div></div><p style="color:#667085">模型尺寸：約 1160 × 2041 × 637 mm。第一版以整機外觀展示為主。</p></main><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';import{GLTFLoader}from'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';const box=document.querySelector('#viewer'),st=document.querySelector('#status');const scene=new THREE.Scene();scene.background=new THREE.Color(0x101613);const camera=new THREE.PerspectiveCamera(42,1,.1,10000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;box.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;scene.add(new THREE.HemisphereLight(0xffffff,0x35443c,2.5));const d=new THREE.DirectionalLight(0xffffff,3);d.position.set(4,6,5);scene.add(d);let model,auto=false;function fit(){if(!model)return;const b=new THREE.Box3().setFromObject(model),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z);controls.target.copy(c);camera.position.set(c.x+m*.85,c.y+m*.55,c.z+m*.85);camera.near=m/1000;camera.far=m*20;camera.updateProjectionMatrix();controls.update()}async function loadModel(){try{st.textContent='下載壓縮模型中…';const r=await fetch('./2603.glb.gz');if(!r.ok)throw new Error('HTTP '+r.status);let buf;if('DecompressionStream' in window){const ds=new DecompressionStream('gzip');buf=await new Response(r.body.pipeThrough(ds)).arrayBuffer()}else{throw new Error('瀏覽器不支援 gzip 解壓')};st.textContent='建立 3D 模型中…';new GLTFLoader().parse(buf,'',g=>{model=g.scene;scene.add(model);fit();st.textContent='3D 模型載入完成'},e=>{throw e})}catch(e){console.error(e);st.textContent='模型載入失敗，請重新整理或改用最新版 Chrome / Edge'}}loadModel();function size(){const w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}new ResizeObserver(size).observe(box);document.querySelector('#reset').onclick=fit;document.querySelector('#rotate').onclick=e=>{auto=!auto;controls.autoRotate=auto;e.target.textContent='自動旋轉：'+(auto?'開':'關')};function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();</script></body></html>
